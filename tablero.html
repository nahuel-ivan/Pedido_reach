<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos de Material</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef1f4;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitulo {
            margin-top: 8px;
            font-size: 15px;
            opacity: 0.8;
        }

        .contenedor {
            width: 100%;
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .resumen {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .contador {
            background: white;
            border-radius: 12px;
            padding: 18px 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .contador .numero {
            font-size: 32px;
            font-weight: bold;
        }

        .contador .texto {
            font-size: 14px;
            color: #666;
        }

        .contador-pendiente .numero {
            color: #dc3545;
        }

        #pedidos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 20px;
        }

        .pedido {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
            border-left: 7px solid #dc3545;
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .numero-pedido {
            font-size: 20px;
            font-weight: bold;
        }

        .estado {
            background: #f8d7da;
            color: #842029;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .dato {
            margin-bottom: 13px;
        }

        .dato-titulo {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .dato-valor {
            font-size: 19px;
            font-weight: bold;
        }

        .local {
            background: #fff3cd;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
        }

        .local .dato-valor {
            font-size: 23px;
        }

        .boton-bajado {
            width: 100%;
            border: none;
            background: #198754;
            color: white;
            padding: 15px;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .boton-bajado:hover {
            background: #157347;
        }

        .boton-bajado:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .sin-pedidos {
            background: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .sin-pedidos .icono {
            font-size: 55px;
        }

        .sin-pedidos h2 {
            margin-bottom: 8px;
        }

        .sin-pedidos p {
            color: #777;
        }

        .actualizacion {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 24px;
            }

            .contenedor {
                padding: 0 10px;
            }

            .resumen {
                flex-direction: column;
            }

        }

    </style>
</head>

<body>

<header>

    <h1>📦 PEDIDOS DE MATERIAL</h1>

    <div class="subtitulo">
        Tablero del Richero
    </div>

</header>


<div class="contenedor">

    <div class="resumen">

        <div class="contador contador-pendiente">

            <div class="numero" id="cantidadPendientes">
                0
            </div>

            <div class="texto">
                PEDIDOS PENDIENTES
            </div>

        </div>

    </div>


    <div id="pedidos"></div>


    <div class="actualizacion" id="actualizacion">
        Actualizando...
    </div>

</div>


<script>

    // ==========================================
    // CONFIGURACIÓN SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://zdoscwyvoazrtpofrabg.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_N7bJtip-RJo3KTMUtIotKw_UIfk9R_H";


    // ==========================================
    // CARGAR PEDIDOS
    // ==========================================

    async function cargarPedidos() {

        try {

            const respuesta = await fetch(
                SUPABASE_URL +
                "/rest/v1/pedidos_material" +
                "?estado=eq.PENDIENTE" +
                "&order=fecha_hora.asc",
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    }
                }
            );


            if (!respuesta.ok) {

                const error = await respuesta.text();

                console.error(error);

                throw new Error("Error al obtener pedidos");

            }


            const pedidos = await respuesta.json();


            mostrarPedidos(pedidos);


            document.getElementById("actualizacion").textContent =
                "Última actualización: " +
                new Date().toLocaleTimeString("es-AR");


        } catch (error) {

            console.error(error);

            document.getElementById("actualizacion").textContent =
                "❌ Error al actualizar los pedidos";

        }

    }


    // ==========================================
    // MOSTRAR PEDIDOS
    // ==========================================

    function mostrarPedidos(pedidos) {

        const contenedor =
            document.getElementById("pedidos");

        const contador =
            document.getElementById("cantidadPendientes");


        contador.textContent = pedidos.length;


        if (pedidos.length === 0) {

            contenedor.innerHTML = `

                <div class="sin-pedidos">

                    <div class="icono">
                        ✅
                    </div>

                    <h2>
                        No hay pedidos pendientes
                    </h2>

                    <p>
                        Todos los materiales están al día.
                    </p>

                </div>

            `;

            return;
        }


        contenedor.innerHTML = "";


        pedidos.forEach(function(pedido) {

            const tarjeta =
                document.createElement("div");

            tarjeta.className = "pedido";


            const fecha =
                new Date(pedido.fecha_hora);


            const fechaTexto =
                fecha.toLocaleDateString("es-AR") +
                " " +
                fecha.toLocaleTimeString(
                    "es-AR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            tarjeta.innerHTML = `

                <div class="pedido-header">

                    <div class="numero-pedido">

                        PEDIDO #${pedido.id}

                    </div>

                    <div class="estado">

                        PENDIENTE

                    </div>

                </div>


                <div class="dato">

                    <div class="dato-titulo">
                        Diseño
                    </div>

                    <div class="dato-valor">
                        ${pedido.diseno}
                    </div>

                </div>


                <div class="dato">

                    <div class="dato-titulo">
                        CIM
                    </div>

                    <div class="dato-valor">
                        ${pedido.cim}
                    </div>

                </div>


                <div class="dato">

                    <div class="dato-titulo">
                        MASTERCIM
                    </div>

                    <div class="dato-valor">

                        ${pedido.mastercim || "—"}

                    </div>

                </div>


                <div class="dato">

                    <div class="dato-titulo">
                        Cantidad
                    </div>

                    <div class="dato-valor">

                        ${pedido.cantidad ?? "—"}

                    </div>

                </div>


                <div class="local">

                    <div class="dato-titulo">
                        📍 Local
                    </div>

                    <div class="dato-valor">

                        ${pedido.local}

                    </div>

                </div>


                <div class="dato">

                    <div class="dato-titulo">
                        Pedido realizado
                    </div>

                    <div class="dato-valor">

                        ${fechaTexto}

                    </div>

                </div>


                <button
                    class="boton-bajado"
                    onclick="marcarBajado(${pedido.id}, this)"
                >

                    ✅ MATERIAL BAJADO

                </button>

            `;


            contenedor.appendChild(tarjeta);

        });

    }


    // ==========================================
    // MARCAR MATERIAL COMO BAJADO
    // ==========================================

    async function marcarBajado(id, boton) {

        const confirmar =
            confirm(
                "¿Confirmás que el material ya fue bajado?"
            );


        if (!confirmar) {
            return;
        }


        boton.disabled = true;

        boton.textContent = "ACTUALIZANDO...";


        try {

            const respuesta = await fetch(

                SUPABASE_URL +
                "/rest/v1/pedidos_material?id=eq." +
                id,

                {

                    method: "PATCH",

                    headers: {

                        "apikey": SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body: JSON.stringify({

                        estado: "BAJADO",

                        fecha_bajado:
                            new Date().toISOString()

                    })

                }

            );


            if (!respuesta.ok) {

                const error =
                    await respuesta.text();

                console.error(error);

                throw new Error(
                    "No se pudo actualizar"
                );

            }


            // Actualizar inmediatamente
            cargarPedidos();


        } catch (error) {

            console.error(error);

            alert(
                "❌ No se pudo marcar el pedido como bajado."
            );

            boton.disabled = false;

            boton.textContent =
                "✅ MATERIAL BAJADO";

        }

    }


    // ==========================================
    // PRIMERA CARGA
    // ==========================================

    cargarPedidos();


    // ==========================================
    // ACTUALIZAR CADA 30 SEGUNDOS
    // ==========================================

    setInterval(
        cargarPedidos,
        30000
    );

</script>

</body>
</html>
