<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos de Material</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #222;
            font-size: 32px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .boton {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .boton:hover {
            transform: scale(1.02);
        }

        .pedido {
            background: #007bff;
            color: white;
        }

        .tablero {
            background: #28a745;
            color: white;
        }

        .historial {
            background: #6f42c1;
            color: white;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>📦 PEDIDOS DE MATERIAL</h1>

        <div class="subtitulo">
            Seleccioná una opción
        </div>

        <a href="pedido.html" class="boton pedido">
            👷 REALIZAR PEDIDO
        </a>

        <a href="tablero.html" class="boton tablero">
            📦 TABLERO DEL RICHERO
        </a>

            📋 HISTORIAL DE PEDIDOS
        </a>

    </div>

</body>
</html>
