<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedidos de Material</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2f7,
                    #dfe5ec
                );

            display: flex;

            justify-content: center;

            align-items: center;

            color: #222;

        }


        .contenedor {

            width: 100%;

            max-width: 650px;

            padding: 20px;

        }


        .tarjeta {

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);

            text-align: center;

        }


        .icono {

            font-size: 65px;

            margin-bottom: 10px;

        }


        h1 {

            margin: 0;

            font-size: 32px;

        }


        .descripcion {

            color: #666;

            margin-top: 10px;

            margin-bottom: 35px;

            font-size: 16px;

        }


        .boton {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            padding: 20px;

            margin-top: 15px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 20px;

            font-weight: bold;

            color: white;

            transition: 0.2s;

        }


        .boton-operario {

            background: #198754;

        }


        .boton-operario:hover {

            background: #157347;

            transform: translateY(-2px);

        }


        .boton-richero {

            background: #1f2937;

        }


        .boton-richero:hover {

            background: #111827;

            transform: translateY(-2px);

        }


        .pie {

            margin-top: 30px;

            color: #999;

            font-size: 13px;

        }


        @media (max-width: 600px) {

            .tarjeta {

                padding: 30px 20px;

            }


            h1 {

                font-size: 27px;

            }


            .boton {

                font-size: 18px;

                padding: 18px;

            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <div class="tarjeta">


        <div class="icono">
            📦
        </div>


        <h1>
            Pedidos de Material
        </h1>


        <div class="descripcion">

            Sistema de solicitud y bajada
            de materiales

        </div>


        <a
            href="pedido.html"
            class="boton boton-operario"
        >

            👷
            REALIZAR PEDIDO

        </a>


        <a
            href="tablero.html"
            class="boton boton-richero"
        >

            📦
            TABLERO DEL RICHERO

        </a>


        <div class="pie">

            Sistema interno

        </div>


    </div>


</div>


</body>

</html>
