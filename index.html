<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos de Material</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .contenedor {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px 30px;

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            color: #222;

            font-size: 30px;
        }

        .subtitulo {
            color: #666;

            margin-bottom: 30px;

            font-size: 16px;
        }

        /* LOGIN */

        #login {

            display: block;

        }

        #sistema {

            display: none;

        }

        .candado {

            font-size: 55px;

            margin-bottom: 10px;

        }

        .campo-clave {

            width: 100%;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 18px;

            text-align: center;

            margin-bottom: 15px;

            outline: none;

        }

        .campo-clave:focus {

            border-color: #007bff;

        }

        .boton-ingresar {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: #007bff;

            color: white;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

        }

        .boton-ingresar:hover {

            background: #0069d9;

        }

        .error {

            color: #dc3545;

            font-weight: bold;

            margin-top: 15px;

            display: none;

        }

        /* BOTONES DEL SISTEMA */

        .boton {

            display: block;

            width: 100%;

            padding: 20px;

            margin: 15px 0;

            border: none;

            border-radius: 14px;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s;

        }

        .boton:hover {

            transform: scale(1.02);

        }

        .pedido {

            background: #007bff;

            color: white;

        }

        .tablero {

            background: #28a745;

            color: white;

        }

        .historial {

            background: #6f42c1;

            color: white;

        }

        .cerrar {

            background: #dc3545;

            color: white;

            margin-top: 25px;

            font-size: 16px;

            padding: 14px;

        }

        .mensaje {

            color: #28a745;

            font-weight: bold;

            margin-bottom: 20px;

        }

    </style>

</head>

<body>


<div class="contenedor">


    <!-- ============================= -->
    <!-- LOGIN -->
    <!-- ============================= -->

    <div id="login">

        <div class="candado">
            🔐
        </div>

        <h1>
            ACCESO AL SISTEMA
        </h1>

        <div class="subtitulo">
            Ingresá la clave para continuar
        </div>


        <input
            type="password"
            id="clave"
            class="campo-clave"
            placeholder="Ingresar clave"
            autocomplete="off"
        >


        <button
            class="boton-ingresar"
            onclick="ingresar()"
        >
            🔓 INGRESAR
        </button>


        <div
            id="error"
            class="error"
        >
            ❌ Clave incorrecta
        </div>

    </div>


    <!-- ============================= -->
    <!-- SISTEMA -->
    <!-- ============================= -->

    <div id="sistema">

        <h1>
            📦 PEDIDOS DE MATERIAL
        </h1>

        <div class="mensaje">
            ✅ Acceso autorizado
        </div>


        <a
            href="pedido.html"
            class="boton pedido"
        >
            👷 REALIZAR PEDIDO
        </a>


        <a
            href="tablero.html"
            class="boton tablero"
        >
            📦 TABLERO DEL RICHERO
        </a>


        <a
            href="historial.html"
            class="boton historial"
        >
            📋 HISTORIAL DE PEDIDOS
        </a>


        <button
            class="boton cerrar"
            onclick="cerrarSesion()"
        >
            🚪 CERRAR SESIÓN
        </button>

    </div>


</div>


<script>

    // =====================================
    // CLAVE DEL SISTEMA
    // =====================================

    const CLAVE_CORRECTA = "Richero2026";


    // =====================================
    // INGRESAR
    // =====================================

    function ingresar() {

        const clave =
            document.getElementById("clave").value;


        const error =
            document.getElementById("error");


        if (clave === CLAVE_CORRECTA) {

            // Guardamos que inició sesión
            sessionStorage.setItem(
                "accesoPedidos",
                "true"
            );


            // Ocultar login
            document.getElementById("login")
                .style.display = "none";


            // Mostrar sistema
            document.getElementById("sistema")
                .style.display = "block";


            error.style.display = "none";

        }

        else {

            error.style.display = "block";

            document.getElementById("clave")
                .value = "";

            document.getElementById("clave")
                .focus();

        }

    }


    // =====================================
    // ENTER PARA INGRESAR
    // =====================================

    document
        .getElementById("clave")
        .addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    ingresar();

                }

            }
        );


    // =====================================
    // CERRAR SESIÓN
    // =====================================

    function cerrarSesion() {

        sessionStorage.removeItem(
            "accesoPedidos"
        );


        document.getElementById("sistema")
            .style.display = "none";


        document.getElementById("login")
            .style.display = "block";


        document.getElementById("clave")
            .value = "";

    }


    // =====================================
    // COMPROBAR SESIÓN
    // =====================================

    window.onload = function() {

        const acceso =
            sessionStorage.getItem(
                "accesoPedidos"
            );


        if (acceso === "true") {

            document.getElementById("login")
                .style.display = "none";


            document.getElementById("sistema")
                .style.display = "block";

        }

    };

</script>


</body>
</html>
