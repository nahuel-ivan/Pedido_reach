<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos de Material</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 550px;

            background: white;
            padding: 40px 30px;

            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.12);

            text-align: center;
        }

        .logo {
            width: 260px;
            max-width: 80%;

            margin: 0 auto 30px auto;
            display: block;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado .logo {
            margin-bottom: 25px;
        }

        .encabezado h1 {
            margin: 0 0 8px 0;
            color: #17202a;
            font-size: 30px;
        }

        .encabezado p {
            color: #6b7280;
            font-size: 16px;
        }

        .menu {
            display: grid;
            gap: 15px;
        }

        .boton {
            display: flex;
            align-items: center;
            gap: 18px;

            text-decoration: none;
            color: #17202a;

            background: #f8fafc;
            border: 1px solid #e5e7eb;

            padding: 20px;
            border-radius: 14px;

            transition: 0.2s;
        }

        .boton:hover {
            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(0,0,0,0.08);

            background: #ffffff;
        }

        .icono {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #17202a;

            color: white;
            font-size: 26px;

            flex-shrink: 0;
        }

        .texto {
            text-align: left;
        }

        .texto h2 {
            font-size: 18px;
            margin: 0 0 5px 0;
        }

        .texto p {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 30px 20px;
            }

            .logo {
                width: 220px;
            }

            .encabezado h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->

    <div class="encabezado">

        <img
            class="logo"
            src="https://www.media.stellantis.com/cache/b/1/b/0/d/b1b0de6c81a6ca391a55f3e3cadcb2bee4a96063.png"
            alt="Stellantis"
        >

        <h1>
            📦 PEDIDOS DE MATERIAL
        </h1>

        <p>
            Gestión de pedidos de material
        </p>

    </div>


    <!-- MENÚ PRINCIPAL -->

    <div class="menu">

        <!-- REALIZAR PEDIDO -->

        <a
            class="boton"
            href="pedido.html"
        >

            <div class="icono">
                👷
            </div>

            <div class="texto">

                <h2>
                    Realizar pedido
                </h2>

                <p>
                    Solicitar material al richero
                </p>

            </div>

        </a>


        <!-- TABLERO -->

        <a
            class="boton"
            href="tablero.html"
        >

            <div class="icono">
                📦
            </div>

            <div class="texto">

                <h2>
                    Tablero del richero
                </h2>

                <p>
                    Ver pedidos pendientes
                </p>

            </div>

        </a>


        <!-- HISTORIAL -->

        <a
            class="boton"
            href="historial.html"
        >

            <div class="icono">
                📋
            </div>

            <div class="texto">

                <h2>
                    Historial de pedidos
                </h2>

                <p>
                    Consultar pedidos realizados
                </p>

            </div>

        </a>

    </div>


    <!-- PIE DE PÁGINA -->

    <div class="footer">

        Sistema de gestión de materiales

    </div>

</div>

</body>

</html>
