<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial de Pedidos</title>

    <!-- Librería para generar archivos Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .contenedor {
            width: 95%;
            max-width: 1500px;
            margin: 30px auto;
        }

        .encabezado {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 30px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 20px;
        }

        .botones-superiores {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .boton {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .volver {
            background: #6c757d;
            color: white;
        }

        .exportar {
            background: #198754;
            color: white;
        }

        .boton:hover {
            opacity: 0.9;
        }

        .filtros {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .fila-filtros {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .botones-filtro {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buscar {
            background: #007bff;
            color: white;
        }

        .limpiar {
            background: #dc3545;
            color: white;
        }

        .info {
            background: white;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .tabla-contenedor {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #343a40;
            color: white;
            padding: 14px 10px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .estado {
            background: #d1e7dd;
            color: #0f5132;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }

        .sin-resultados {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 800px) {

            .fila-filtros {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

            .boton {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->

    <div class="encabezado">

        <h1>📋 HISTORIAL DE PEDIDOS</h1>

        <div class="subtitulo">
            Pedidos de material que ya fueron bajados.
        </div>

        <div class="botones-superiores">

            <a href="index.html" class="boton volver">
                🏠 INICIO
            </a>

            <a href="tablero.html" class="boton volver">
                📦 TABLERO
            </a>

            <button class="boton exportar" onclick="exportarExcel()">
                📥 EXPORTAR A EXCEL
            </button>

        </div>

    </div>


    <!-- FILTROS -->

    <div class="filtros">

        <div class="fila-filtros">

            <div class="campo">

                <label for="busqueda">
                    Buscar
                </label>

                <input
                    type="text"
                    id="busqueda"
                    placeholder="Diseño, CIM, MasterCIM o Local..."
                >

            </div>


            <div class="campo">

                <label for="fechaDesde">
                    Fecha desde
                </label>

                <input
                    type="date"
                    id="fechaDesde"
                >

            </div>


            <div class="campo">

                <label for="fechaHasta">
                    Fecha hasta
                </label>

                <input
                    type="date"
                    id="fechaHasta"
                >

            </div>

        </div>


        <div class="botones-filtro">

            <button class="boton buscar" onclick="buscar()">
                🔎 BUSCAR
            </button>

            <button class="boton limpiar" onclick="limpiarFiltros()">
                🗑️ LIMPIAR
            </button>

        </div>

    </div>


    <!-- INFORMACIÓN -->

    <div class="info" id="contador">
        Cargando historial...
    </div>


    <!-- TABLA -->

    <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>
                    <th>PEDIDO</th>
                    <th>DISEÑO</th>
                    <th>CIM</th>
                    <th>MASTERCIM</th>
                    <th>CANTIDAD</th>
                    <th>LOCAL</th>
                    <th>FECHA PEDIDO</th>
                    <th>FECHA BAJADO</th>
                    <th>ESTADO</th>
                </tr>

            </thead>

            <tbody id="tablaHistorial">

            </tbody>

        </table>

    </div>

</div>


<script>

    // ==========================================
    // CONFIGURACIÓN SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://zdoscwyvoazrtpofrabg.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_N7bJtip-RJo3KTMUtIotKw_UIfk9R_H";


    // ==========================================
    // VARIABLES
    // ==========================================

    let todosLosPedidos = [];
    let pedidosFiltrados = [];


    // ==========================================
    // CARGAR HISTORIAL
    // ==========================================

    async function cargarHistorial() {

        try {

            const respuesta = await fetch(
                SUPABASE_URL +
                "/rest/v1/pedidos_material" +
                "?estado=eq.BAJADO" +
                "&order=fecha_bajado.desc",
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    }
                }
            );


            if (!respuesta.ok) {

                throw new Error(
                    "Error al consultar Supabase"
                );

            }


            todosLosPedidos = await respuesta.json();


            buscar();

        } catch (error) {

            console.error(error);

            document.getElementById("contador").innerText =
                "❌ Error al cargar el historial.";

        }

    }


    // ==========================================
    // BUSCAR / FILTRAR
    // ==========================================

    function buscar() {

        const texto =
            document
            .getElementById("busqueda")
            .value
            .trim()
            .toLowerCase();


        const fechaDesde =
            document
            .getElementById("fechaDesde")
            .value;


        const fechaHasta =
            document
            .getElementById("fechaHasta")
            .value;


        pedidosFiltrados =
            todosLosPedidos.filter(pedido => {


                // ------------------------------
                // BÚSQUEDA DE TEXTO
                // ------------------------------

                const coincideTexto =
                    !texto ||

                    String(pedido.diseno || "")
                        .toLowerCase()
                        .includes(texto) ||

                    String(pedido.cim || "")
                        .toLowerCase()
                        .includes(texto) ||

                    String(pedido.mastercim || "")
                        .toLowerCase()
                        .includes(texto) ||

                    String(pedido.local || "")
                        .toLowerCase()
                        .includes(texto);


                if (!coincideTexto) {
                    return false;
                }


                // ------------------------------
                // FECHA DESDE
                // ------------------------------

                if (fechaDesde) {

                    const fechaBajado =
                        new Date(pedido.fecha_bajado);

                    const desde =
                        new Date(fechaDesde + "T00:00:00");


                    if (fechaBajado < desde) {
                        return false;
                    }

                }


                // ------------------------------
                // FECHA HASTA
                // ------------------------------

                if (fechaHasta) {

                    const fechaBajado =
                        new Date(pedido.fecha_bajado);

                    const hasta =
                        new Date(fechaHasta + "T23:59:59");


                    if (fechaBajado > hasta) {
                        return false;
                    }

                }


                return true;

            });


        mostrarTabla();

    }


    // ==========================================
    // MOSTRAR TABLA
    // ==========================================

    function mostrarTabla() {

        const tabla =
            document.getElementById("tablaHistorial");


        tabla.innerHTML = "";


        document.getElementById("contador").innerText =
            "📊 Pedidos encontrados: " +
            pedidosFiltrados.length;


        if (pedidosFiltrados.length === 0) {

            tabla.innerHTML = `
                <tr>
                    <td colspan="9" class="sin-resultados">
                        No se encontraron pedidos.
                    </td>
                </tr>
            `;

            return;

        }


        pedidosFiltrados.forEach(pedido => {

            const fila =
                document.createElement("tr");


            fila.innerHTML = `

                <td>
                    #${pedido.id}
                </td>

                <td>
                    ${escapeHTML(pedido.diseno)}
                </td>

                <td>
                    ${escapeHTML(pedido.cim)}
                </td>

                <td>
                    ${escapeHTML(pedido.mastercim || "-")}
                </td>

                <td>
                    ${pedido.cantidad ?? "-"}
                </td>

                <td>
                    ${escapeHTML(pedido.local)}
                </td>

                <td>
                    ${formatearFecha(pedido.fecha_hora)}
                </td>

                <td>
                    ${formatearFecha(pedido.fecha_bajado)}
                </td>

                <td>
                    <span class="estado">
                        ${escapeHTML(pedido.estado)}
                    </span>
                </td>

            `;


            tabla.appendChild(fila);

        });

    }


    // ==========================================
    // EXPORTAR A EXCEL
    // ==========================================

    function exportarExcel() {

        if (pedidosFiltrados.length === 0) {

            alert(
                "No hay pedidos para exportar."
            );

            return;

        }


        // Crear datos para Excel

        const datosExcel =
            pedidosFiltrados.map(pedido => ({

                "Pedido":
                    pedido.id,

                "Diseño":
                    pedido.diseno,

                "CIM":
                    pedido.cim,

                "MasterCIM":
                    pedido.mastercim || "",

                "Cantidad":
                    pedido.cantidad ?? "",

                "Local":
                    pedido.local,

                "Fecha Pedido":
                    formatearFecha(pedido.fecha_hora),

                "Fecha Bajado":
                    formatearFecha(pedido.fecha_bajado),

                "Estado":
                    pedido.estado

            }));


        // Crear hoja

        const hoja =
            XLSX.utils.json_to_sheet(datosExcel);


        // Crear libro

        const libro =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            libro,
            hoja,
            "Historial"
        );


        // Generar nombre

        const ahora =
            new Date();


        const fecha =
            ahora.getFullYear() +
            "-" +
            String(ahora.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(ahora.getDate()).padStart(2, "0");


        const nombreArchivo =
            "historial_pedidos_" +
            fecha +
            ".xlsx";


        // Descargar

        XLSX.writeFile(
            libro,
            nombreArchivo
        );

    }


    // ==========================================
    // LIMPIAR FILTROS
    // ==========================================

    function limpiarFiltros() {

        document.getElementById("busqueda").value = "";

        document.getElementById("fechaDesde").value = "";

        document.getElementById("fechaHasta").value = "";

        buscar();

    }


    // ==========================================
    // FORMATEAR FECHA
    // ==========================================

    function formatearFecha(fecha) {

        if (!fecha) {
            return "-";
        }


        const fechaObj =
            new Date(fecha);


        return fechaObj.toLocaleString(
            "es-AR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    // ==========================================
    // SEGURIDAD HTML
    // ==========================================

    function escapeHTML(valor) {

        if (valor === null ||
            valor === undefined) {

            return "";

        }


        return String(valor)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // CARGAR AL ABRIR
    // ==========================================

    cargarHistorial();


    // ==========================================
    // ACTUALIZAR CADA 60 SEGUNDOS
    // ==========================================

    setInterval(
        cargarHistorial,
        60000
    );

</script>

</body>
</html>
